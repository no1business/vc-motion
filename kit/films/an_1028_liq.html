<script>

 "scenes": [

const W = 1080, H = 1920, CX = 540;
const C = { bg: '#05070A', cy: [79, 227, 255], cyH: '#4FE3FF', red: [255, 77, 94], redH: '#FF4D5E', bone: '#EAF2F6', dim: 'rgba(234,242,246,.45)' };
const { prog, E, lerp, clamp, spring, noise1, hash } = K;
const g = document.getElementById('c').getContext('2d');
const em = document.createElement('canvas'); em.width = W; em.height = H; const eg = em.getContext('2d');
const bloom = K.makeBloom(W, H), grain = K.makeGrain(W, H);
const rg = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function rr(gg, x, y, w, h, r) { gg.beginPath(); gg.moveTo(x + r, y); gg.arcTo(x + w, y, x + w, y + h, r); gg.arcTo(x + w, y + h, x, y + h, r); gg.arcTo(x, y + h, x, y, r); gg.arcTo(x, y, x + w, y, r); gg.closePath(); }
const DEF = [3.0, 2.4, 3.4, 3.6, 3.2, 3.6];
const DUR = () => (window.SPEC ? window.SPEC.scenes.map((s) => s.dur) : DEF);
function ST(i) { const d = DUR(); let s = 0; for (let k = 0; k < i; k++) s += d[k]; return s; }
const TOTAL = () => DUR().reduce((a, b) => a + b, 0);
const LY = 760;                 // 가격선 높이
const TAGS = 7;                 // 롱 꼬리표 수
const TAGX = (k) => 150 + k * 130;
function text(gg, s, x, y, font, col, align = 'center', ls = '-2px') { gg.font = font; gg.fillStyle = col; gg.textAlign = align; gg.letterSpacing = ls; gg.fillText(s, x, y); }
function maskUp(s, x, y, font, col, p, h = 160, align = 'center') { g.save(); g.beginPath(); g.rect(0, y - h * .82, W, h); g.clip(); text(g, s, x, y + (1 - E.out5(p)) * h, font, col, align); g.restore(); }

window.seek = function (t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  eg.setTransform(1, 0, 0, 1, 0, 0); eg.clearRect(0, 0, W, H);
  const s1 = ST(1), s2 = ST(2), s3 = ST(3), s4 = ST(4), s5 = ST(5), d = DUR();
  // 카메라: 계속 조금씩 밀기
  const push = 1 + .025 * Math.sin(t * .45) + .04 * prog(t, 0, TOTAL());
  // 배경 빛 하나 (피사체 뒤)
  { const vg = g.createRadialGradient(CX, LY, 40, CX, LY, 900); vg.addColorStop(0, 'rgba(30,70,90,.28)'); vg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = vg; g.fillRect(0, 0, W, H); }

  /* ===== S0 훅: 빛 한 점 → 평평한 가격선 → 매달린 롱 꼬리표 (0 ~ s1) / S3 에서 다시 씀 ===== */
  const lineOn = (t < s1 + .5) || (t >= s3 - .3 && t < s4 + .4);
  if (lineOn) {
    const inA = t < s1 + .5;
    const dot = E.out3(prog(t, 0, .3)), st = inA ? E.expo(prog(t, .25, .6)) : 1;
    const away = inA ? E.in3(prog(t, s1 - .1, .5)) : E.in3(prog(t, s4 - .1, .45)) ;
    const back = inA ? 1 : E.out5(prog(t, s3 - .3, .5));
    const half = 470 * st * back, al = 1 - away;
    // 꼬리(S3): 아래로 찌르고 돌아옴
    const wk = inA ? 0 : Math.sin(Math.PI * E.inOut3(prog(t, s3 + .5, 1.3)));
    const wx = CX + 40, depth = 430 * wk;
    eg.save(); eg.globalAlpha = al; eg.lineCap = 'round';
    eg.strokeStyle = rg(C.cy, .95); eg.lineWidth = 4; eg.beginPath();
    for (let x = CX - half; x <= CX + half; x += 6) {
      const n = noise1(x * .02 + t * 1.2, 2) * 6;
      const dip = depth * Math.exp(-Math.pow((x - wx) / 26, 2));
      const y = LY + n + dip; x === CX - half ? eg.moveTo(x, y) : eg.lineTo(x, y);
    } eg.stroke(); eg.restore();
    const fl = Math.exp(-Math.pow((t - .28) / .08, 2));
    if (inA && dot > 0) { const pg = eg.createRadialGradient(CX, LY, 0, CX, LY, 180); pg.addColorStop(0, rg([220, 250, 255], (.9 * dot + fl) * (1 - st * .7))); pg.addColorStop(1, rg(C.cy, 0)); eg.fillStyle = pg; eg.fillRect(0, 0, W, H); }
    // 가격 변화 카운터 (선 위)
    const cIn = E.out5(prog(t, inA ? .55 : s3 - .1, .5)) * al;
    if (cIn > 0) {
      const v = inA ? (prog(t, .6, 1.2) < 1 ? (noise1(t * 14, 5) * .4) : .1) : (wk > .05 ? -(wk * 5.4) : 0);
      g.save(); g.globalAlpha = cIn;
      text(g, 'BTC · 24H', 150, LY - 300, '600 30px M', C.dim, 'left', '4px');
      text(g, (v >= 0 ? '+' : '') + v.toFixed(1) + '%', 150, LY - 160, '800 150px M', wk > .05 ? C.redH : C.bone, 'left', '-6px');
      text(g, '가격', 150, LY - 360, '700 34px P', C.dim, 'left', '0px');
      g.restore();
    }
    // 롱 꼬리표: 선 아래 매달림. S0 끝에 깜빡이고, S3 꼬리가 지나가면 취소선 → 사라짐
    for (let k = 0; k < TAGS; k++) {
      const x = TAGX(k); if (Math.abs(x - CX) > half - 10) continue;
      const hang = spring(t, (inA ? .9 : s3 - .2) + k * .07, 2.2, .55);
      const cut = inA ? 0 : prog(t, s3 + .6 + Math.abs(x - wx) / 900, .25);
      const gone = inA ? 0 : E.in3(prog(t, s3 + 1.0 + k * .08, .5));
      const blink = inA ? (t > s1 - 1.0 ? .5 + .5 * Math.sin(t * 22 + k) : 1) : 1;
      const yy = LY + 40 + 70 * hang + (k % 2) * 90;
      g.save(); g.globalAlpha = al * clamp(hang) * (1 - gone);
      g.strokeStyle = rg([234, 242, 246], .35); g.lineWidth = 2; g.beginPath(); g.moveTo(x, LY + 4); g.lineTo(x, yy - 30); g.stroke();
      rr(g, x - 54, yy - 30, 108, 60, 30); g.fillStyle = rg(C.cy, .12 * blink); g.fill(); g.strokeStyle = rg(C.cy, .9 * blink); g.lineWidth = 2.5; g.stroke();
      text(g, 'LONG', x, yy + 10, '800 26px M', rg(C.cy, blink), 'center', '2px');
      if (cut > 0) { g.strokeStyle = C.redH; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - 62, yy + 2); g.lineTo(x - 62 + 124 * E.out3(cut), yy - 2); g.stroke(); }
      g.restore();
    }
    // 청산선(S3)
    if (!inA) { const lp = E.out3(prog(t, s3, .4)) * al; g.save(); g.globalAlpha = lp; g.setLineDash([16, 12]); g.strokeStyle = C.redH; g.lineWidth = 3; g.beginPath(); g.moveTo(90, LY + 300); g.lineTo(W - 90, LY + 300); g.stroke(); g.setLineDash([]); text(g, '청산가', W - 90, LY + 280, '800 34px P', C.redH, 'right', '0px'); g.restore(); }
  }

  /* ===== S1 빌린 돈 탑: 꼬리표 하나가 탑이 됨 — 내 돈 1 + 빌린 돈 19 (s1 ~ s2) ===== */
  if (t >= s1 - .2 && t < s2 + .6) {
    const out = E.in3(prog(t, s2 + .05, .45));
    const base = 1180, cw = 300, chh = 30;
    for (let k = 0; k < 20; k++) {
      const p = spring(t, s1 + .05 + k * .045, 2.6, .62);
      if (p <= 0) continue;
      const y = base - k * (chh + 4) - (1 - p) * 300;
      const own = k === 0;
      g.save(); g.globalAlpha = clamp(p * 2) * (1 - out);
      rr(g, CX - cw / 2, y - chh, cw, chh, 15);
      if (own) { g.fillStyle = C.bone; g.fill(); } else { g.fillStyle = rg(C.cy, .10); g.fill(); g.strokeStyle = rg(C.cy, .85); g.lineWidth = 2; g.stroke(); }
      g.restore();
    }
    const lab = E.out3(prog(t, s1 + .5, .4)) * (1 - out);
    if (lab > 0) { g.save(); g.globalAlpha = lab;
      text(g, '내 돈', CX - 190, base - 6, '800 36px P', C.bone, 'right', '0px');
      text(g, '빌린 돈', CX + 190, base - 360, '800 36px P', C.cyH, 'left', '0px');
      g.strokeStyle = rg(C.cy, .6); g.lineWidth = 2; g.beginPath(); g.moveTo(CX + 170, base - 40); g.lineTo(CX + 180, base - 40); g.lineTo(CX + 180, base - 680); g.lineTo(CX + 170, base - 680); g.stroke(); g.restore(); }
    const big = spring(t, s1 + .9, 2.4, .6) * (1 - out);
    if (big > 0) { g.save(); g.globalAlpha = clamp(big); g.translate(CX, 330); g.scale(lerp(1.4, 1, clamp(big)), lerp(1.4, 1, clamp(big))); text(g, '×20', 0, 0, '900 220px M', C.cyH, 'center', '-8px'); g.restore();
      eg.save(); eg.globalAlpha = .45 * clamp(big); eg.translate(CX, 330); text(eg, '×20', 0, 0, '900 220px M', C.cyH, 'center', '-8px'); eg.restore(); }
  }

  /* ===== S2 5% 눈금: 탑이 눈금자가 되고 표시가 -5% 까지 내려가 청산 (s2 ~ s3) ===== */
  if (t >= s2 - .1 && t < s3 + .2) {
    const inn = E.out5(prog(t, s2, .45)), out = E.in3(prog(t, s3 - .15, .35));
    const top = 380, bot = 1180, x0 = 300;
    g.save(); g.globalAlpha = inn * (1 - out);
    g.strokeStyle = rg([234, 242, 246], .5); g.lineWidth = 3; g.beginPath(); g.moveTo(x0, top); g.lineTo(x0, top + (bot - top) * inn); g.stroke();
    for (let k = 0; k <= 10; k++) { const y = top + (bot - top) * k / 10; const tp = E.out3(prog(t, s2 + .1 + k * .03, .3)); g.fillStyle = k % 5 === 0 ? C.bone : C.dim; g.fillRect(x0, y - 1.5, (k % 5 === 0 ? 46 : 24) * tp, 3); if (k % 5 === 0) text(g, `-${k / 2}%`, x0 - 24, y + 12, '600 32px M', C.dim, 'right', '0px'); }
    // 청산선 -5%
    const lp = E.out3(prog(t, s2 + .4, .4)); g.setLineDash([16, 12]); g.strokeStyle = C.redH; g.lineWidth = 3; g.beginPath(); g.moveTo(x0, bot); g.lineTo(x0 + 640 * lp, bot); g.stroke(); g.setLineDash([]);
    text(g, '청산가', x0 + 640, bot - 22, '800 40px P', C.redH, 'right', '0px');
    // 가격 표시가 내려감
    const mv = E.inOut3(prog(t, s2 + .7, d[2] - 1.3));
    const my = lerp(top, bot, mv), hit = t > s2 + .7 + d[2] - 1.3;
    g.fillStyle = hit ? C.redH : C.cyH; g.beginPath(); g.moveTo(x0 + 8, my); g.lineTo(x0 + 40, my - 20); g.lineTo(x0 + 40, my + 20); g.closePath(); g.fill();
    text(g, `-${(mv * 5).toFixed(1)}%`, x0 + 70, my + 22, '800 72px M', hit ? C.redH : C.bone, 'left', '-2px');
    eg.save(); eg.globalAlpha = .6; eg.fillStyle = hit ? C.redH : C.cyH; eg.beginPath(); eg.arc(x0 + 20, my, 10, 0, 7); eg.fill(); eg.restore();
    // 도장 '청산'
    const sp = spring(t, s2 + .7 + d[2] - 1.25, 2.8, .5);
    if (sp > 0) { g.save(); g.translate(760, 860); g.rotate(-.14); g.scale(lerp(1.6, 1, clamp(sp)), lerp(1.6, 1, clamp(sp))); g.globalAlpha = clamp(sp * 1.5) * (1 - out);
      rr(g, -150, -70, 300, 140, 14); g.strokeStyle = C.redH; g.lineWidth = 8; g.stroke(); text(g, '청산', 0, 34, '900 96px P', C.redH, 'center', '0px'); g.restore(); }
    g.restore();
  }

  /* ===== S4 반전: 청산이 청산을 부름 — 빨간 도미노가 쓰러질 때마다 계단처럼 가격이 내려감 (s4 ~ s5) ===== */
  if (t >= s4 - .3 && t < s5 + .7) {
    const out = E.in3(prog(t, s5 + .1, .5));
    const N = 6, gap = 132, x0 = 110, by = 1120;
    const cam = E.inOut3(prog(t, s4, d[4])) * 1;
    g.save(); g.globalAlpha = 1 - out; g.translate(CX, 900); g.scale(1.06 + .08 * cam, 1.06 + .08 * cam); g.translate(-CX, -900);
    // 계단 가격선
    eg.save(); eg.globalAlpha = 1 - out; eg.translate(CX, 900); eg.scale(1.06 + .08 * cam, 1.06 + .08 * cam); eg.translate(-CX, -900);
    eg.strokeStyle = C.redH; eg.lineWidth = 5; eg.lineCap = 'round'; eg.lineJoin = 'round'; eg.beginPath(); eg.moveTo(80, 520);
    for (let k = 0; k < N; k++) { const f = prog(t, s4 + .25 + k * .38, .3); if (f <= 0) break; const xa = x0 + k * gap - 20, ya = 520 + k * 62; eg.lineTo(xa, ya); eg.lineTo(xa, ya + 62 * E.out3(f)); if (f >= 1) eg.lineTo(xa + gap, ya + 62); }
    eg.stroke(); eg.restore();
    for (let k = 0; k < N; k++) {
      const fall = E.in3(prog(t, s4 + .25 + k * .38, .32));
      const x = x0 + k * gap, a = (k < N - 1 ? .53 : Math.PI / 2.1) * fall;
      g.save(); g.translate(x + 40, by); g.rotate(a);
      rr(g, -40, -260, 80, 260, 10); g.fillStyle = fall > 0 ? rg(C.red, .9) : rg([234, 242, 246], .12); g.fill(); g.strokeStyle = fall > 0 ? C.redH : C.dim; g.lineWidth = 2; g.stroke();
      g.save(); g.translate(0, -130); g.rotate(-Math.PI / 2); text(g, '청산', 0, 14, '900 40px P', fall > 0 ? '#14060A' : C.dim, 'center', '4px'); g.restore();
      g.restore();
      if (fall > .95) { const fl = Math.exp(-Math.pow((t - (s4 + .25 + k * .38 + .32)) / .07, 2)); if (fl > .02) { const gr = eg.createRadialGradient(x + 140, by, 0, x + 140, by, 120); gr.addColorStop(0, rg(C.red, .8 * fl)); gr.addColorStop(1, rg(C.red, 0)); eg.fillStyle = gr; eg.fillRect(0, 0, W, H); } }
    }
    g.restore();
    const hl = E.out5(prog(t, s4 + .15, .5)) * (1 - out);
    if (hl > 0) { g.save(); g.globalAlpha = hl; text(g, '청산 → 하락 → 또 청산', CX, 330, '900 78px P', C.bone, 'center', '-2px'); g.restore(); }
  }

  /* ===== S5 CTA: 계단선이 종(알림)으로 → 버튼 눌림 (s5 ~ end) ===== */
  if (t >= s5) {
    const lt = t - s5;
    const bell = E.inOut3(prog(lt, .1, .7)), ring = Math.sin(lt * 18) * .18 * Math.exp(-Math.max(0, lt - .9) * 2.2) * (lt > .8 ? 1 : 0);
    eg.save(); eg.translate(CX, 560); eg.rotate(ring); eg.strokeStyle = C.cyH; eg.lineWidth = 9; eg.lineCap = 'round'; eg.lineJoin = 'round';
    const s = .9 + .1 * spring(lt, .7, 2.5, .5); eg.scale(s, s);
    eg.beginPath(); const P = [[-150, 120], [-120, 90], [-110, -40], [-60, -130], [0, -150], [60, -130], [110, -40], [120, 90], [150, 120]];
    const n = Math.ceil(P.length * bell); P.slice(0, n).forEach(([x, y], i) => i ? eg.lineTo(x, y) : eg.moveTo(x, y)); eg.stroke();
    if (bell > .95) { eg.beginPath(); eg.moveTo(-160, 120); eg.lineTo(160, 120); eg.stroke(); eg.beginPath(); eg.arc(0, 160, 28, 0, Math.PI); eg.stroke(); eg.beginPath(); eg.moveTo(0, -150); eg.lineTo(0, -185); eg.stroke(); }
    eg.restore();
    const pg = spring(lt, .7, 2, .62), press = Math.sin(Math.PI * prog(lt, 1.9, .22)), sw = E.expo(prog(lt, 2.6, .45));
    const pw = lerp(140, 780, pg), ph = 140, px = CX - pw / 2, py = 960;
    g.save(); g.globalAlpha = clamp(pg * 2); g.translate(CX, py + ph / 2); g.scale(1 - .05 * press, 1 - .05 * press); g.translate(-CX, -(py + ph / 2));
    rr(g, px, py, pw, ph, 70); g.fillStyle = C.cyH; g.fill(); g.clip(); g.textBaseline = 'middle';
    text(g, '알림 받기', CX, py + ph / 2 + (1 - E.out5(prog(lt, 1.0, .45))) * ph, '900 62px P', '#04121A', 'center', '-1px');
    g.restore(); g.textBaseline = 'alphabetic';
    { const sb = E.out3(prog(lt, 1.3, .5)); g.globalAlpha = sb; text(g, '청산이 몰리는 순간, 바로 알려드려요', CX, 1150 + (1 - sb) * 20, '800 42px P', C.bone, 'center', '-1px'); g.globalAlpha = 1; }
    const hd = E.out3(prog(lt, 1.4, .5)); g.globalAlpha = hd; text(g, '@alphanode_report', CX, 1215, '600 34px M', C.dim, 'center', '2px'); g.globalAlpha = 1;
    const ci = spring(lt, 1.3, 1.6, .75); const cx = lerp(1150, 700, ci), cy = lerp(1500, 1050, ci);
    g.save(); g.translate(cx, cy); g.scale(1 - .18 * press, 1 - .18 * press); g.fillStyle = '#fff'; g.strokeStyle = '#000'; g.lineWidth = 4; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 62); g.lineTo(15, 48); g.lineTo(26, 72); g.lineTo(37, 67); g.lineTo(26, 44); g.lineTo(46, 44); g.closePath(); g.fill(); g.stroke(); g.restore();
  }
